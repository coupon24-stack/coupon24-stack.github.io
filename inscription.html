<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — COUPON24</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0A1F44; --blue:#1E4FD8; --blue-gradient:linear-gradient(135deg,#0A1F44 0%,#1E4FD8 100%); --sky:#E8F0FE; --gray-text:#4A5568; --red:#E53E3E; --green:#27AE60; --gold:#F5A623; --radius:16px; --radius-pill:999px; --shadow:0 4px 20px rgba(10,31,68,0.06); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:#F7F9FC; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:24px; color:var(--navy); }
    .auth-card { background:white; width:100%; max-width:440px; border-radius:var(--radius); box-shadow:var(--shadow); padding:40px 32px; }
    .logo { display:flex; align-items:center; justify-content:center; gap:10px; font-family:'Poppins'; font-weight:800; font-size:1.6rem; margin-bottom:8px; }
    .logo-ball { width:34px; height:34px; background:var(--blue-gradient); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:1.1rem; }
    h1 { font-family:'Poppins'; font-size:1.5rem; text-align:center; margin-bottom:8px; }
    .subtitle { text-align:center; color:var(--gray-text); font-size:0.9rem; margin-bottom:28px; }
    .form-group { margin-bottom:18px; }
    label { display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; }
    label .optional { color:var(--gray-text); font-weight:400; font-size:0.8rem; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="password"] {
      width:100%; padding:12px 16px; border:1.5px solid #E2E8F0; border-radius:10px;
      font-family:'Inter'; font-size:0.95rem; transition:border-color 0.2s;
    }
    input:focus { outline:none; border-color:var(--blue); }
    input#referral_code {
      text-transform:uppercase; font-family:'Courier New', monospace;
      font-weight:700; letter-spacing:2px; font-size:1rem;
    }
    .hint { font-size:0.75rem; color:var(--gray-text); margin-top:4px; }

    /* Champ parrainage — encadré spécial */
    .referral-box {
      background: linear-gradient(135deg, #FFF9E6, #FFF4E5);
      border: 1.5px solid #FFD98A;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .referral-box label {
      color: #B45309;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .referral-box input {
      border-color: #FFD98A;
      background: white;
    }
    .referral-box input:focus { border-color: var(--gold); }
    .referral-box .referral-feedback {
      font-size: 0.78rem;
      margin-top: 6px;
      font-weight: 600;
      display: none;
    }
    .referral-box .referral-feedback.valid { color: var(--green); display: block; }
    .referral-box .referral-feedback.invalid { color: var(--red); display: block; }
    .referral-box .referral-hint {
      font-size: 0.75rem;
      color: #92400E;
      margin-top: 8px;
      line-height: 1.5;
    }

    .checkbox-group { display:flex; align-items:flex-start; gap:10px; font-size:0.85rem; margin-bottom:24px; }
    .checkbox-group input { margin-top:3px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; width:100%; padding:14px; border-radius:var(--radius-pill); font-family:'Inter'; font-size:1rem; font-weight:600; cursor:pointer; border:none; transition:all 0.2s; }
    .btn-primary { background:var(--blue-gradient); color:white; box-shadow:0 4px 14px rgba(30,79,216,0.35); }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(30,79,216,0.45); }
    .btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .alert { padding:12px 16px; border-radius:10px; font-size:0.85rem; margin-bottom:20px; display:none; }
    .alert-error { background:#FED7D7; color:#9B2C2C; border:1px solid #FEB2B2; }
    .alert-success { background:#C6F6D5; color:#22543D; border:1px solid #9AE6B4; }
    .footer-link { text-align:center; font-size:0.85rem; color:var(--gray-text); margin-top:24px; }
    .footer-link a { color:var(--blue); font-weight:600; text-decoration:none; }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="logo">
    <span class="logo-ball">⚽</span>
    <span>COUPON<span style="color: var(--blue);">24</span></span>
  </div>
  <h1>Crée ton compte</h1>
  <p class="subtitle">Rejoins COUPON24 et accède aux coupons football.</p>

  <div id="alert-box" class="alert"></div>

  <form id="signup-form">
    <div class="form-group">
      <label for="full_name">Nom complet</label>
      <input type="text" id="full_name" placeholder="Ex: Koffi Yao" required />
    </div>

    <div class="form-group">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" placeholder="ton.email@exemple.com" required />
    </div>

    <div class="form-group">
      <label for="phone">Numéro de téléphone</label>
      <input type="tel" id="phone" placeholder="+225 07 00 00 00 00" required />
      <div class="hint">Format ivoirien : +225 suivi de 8 à 10 chiffres.</div>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="Minimum 8 caractères" required minlength="8" />
    </div>

    <div class="form-group">
      <label for="confirm_password">Confirmer le mot de passe</label>
      <input type="password" id="confirm_password" placeholder="Répète ton mot de passe" required />
    </div>

    <div class="referral-box" id="referral-box">
      <label for="referral_code">🎁 Code de parrainage <span class="optional">(optionnel)</span></label>
      <input type="text" id="referral_code" maxlength="9" placeholder="Ex: KOFF-252C" autocomplete="off" />
      <div class="referral-feedback" id="referral-feedback"></div>
      <div class="referral-hint">
        💡 Si un ami t'a parrainé, entre son code ici. Tu recevras des <strong>jours gratuits</strong> lors de ton premier abonnement !
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="terms" required />
      <label for="terms" style="font-weight: 400;">
        J'accepte les conditions d'utilisation et la politique de confidentialité.
      </label>
    </div>

    <button type="submit" class="btn btn-primary" id="submit-btn">Créer mon compte</button>
  </form>

  <p class="footer-link">Déjà un compte ? <a href="/connexion.html">Se connecter</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
